name: ci

# The gate that matters is the last step. Firsthand's claim is that its memory is
# load-bearing, and the build goes red the day that stops being true.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        # Scope comes from pyproject's files=, which excludes tests on purpose.
        # Passing a path here would override it and check a different tree.
        run: mypy

      - name: Tests
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log

      # Logs and job summaries both need an account to read. Annotations do not,
      # so the failure itself goes there and a red build says what broke to
      # anyone looking, signed in or not.
      - name: What failed
        if: failure()
        run: |
          {
            echo '### pytest'
            echo '```'
            tail -n 120 pytest.log 2>/dev/null || echo 'no pytest output; an earlier step failed'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f pytest.log ]; then
            body=$(grep -E "^(FAILED|ERROR|E  )" pytest.log | head -n 25 \
              | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pytest on $(python --version 2>&1)::${body:-see log}"
          fi

      # The real database is gitignored, holds addresses indexed from Base, and
      # could not be rebuilt here anyway because CI has no Base RPC. The fixture
      # is generated from addresses that are obviously synthetic.
      - name: Build the fixture dossier
        run: python scripts/build_fixture.py --out .ci/memory.db

      - name: Deletion test
        # --require-basis because the gate on its own only asserts that
        # memory-off is unusable, which an empty database also satisfies. Without
        # it a fixture that silently failed to build would still go green.
        run: |
          python scripts/deletion_test.py \
            --agent 0x00000000000000000000000000000000000000aa \
            --db .ci/memory.db \
            --require-basis
